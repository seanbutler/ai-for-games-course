# Per-unit spec. LOCAL dependency: changing this rebuilds only this unit.

title: "Neural Network Architectures"
week: 3
time_budget_minutes:
  lecture: 120
  tutorial: 120

prerequisites:
  - "Unit 04 (gradient descent, backpropagation, learning loop)"

outcomes:
  - "Describe the structure and forward pass of a multilayer perceptron. [lo4]"
  - "Explain how convolutional layers exploit spatial locality for image and grid inputs. [lo4]"
  - "Describe recurrent networks and LSTMs as mechanisms for sequential state. [lo4]"
  - "Explain the transformer self-attention mechanism at a conceptual level. [lo4]"
  - "Select an appropriate architecture for a given games-relevant input modality. [lo2, lo5]"

concepts:
  - "Perceptron to MLP: layers, weights, biases, activation functions (ReLU, sigmoid, tanh)"
  - "Convolutional neural networks: convolution, pooling, feature maps; translation invariance"
  - "CNN applications to games: processing pixel frames, tile maps, game-state grids"
  - "Recurrent networks: unrolling through time, vanishing gradient problem"
  - "LSTMs and GRUs: gating mechanisms and when sequence memory matters"
  - "Transformers: self-attention, positional encoding, multi-head attention; encoder/decoder roles"
  - "Practical: batch normalisation, dropout, modern optimisers (Adam)"

references: ["goodfellow", "lecun1998", "vaswani2017"]

worked_examples:
  - "Trace a forward pass through a small CNN processing a 16×16 tile-map excerpt: show dimensions at each layer."
  - "Contrast a vanilla RNN and an LSTM processing a short sequence of game events; show where the LSTM gate prevents gradient vanishing."

tutorial:
  brief: >
    Using PyTorch (or TensorFlow), implement a small CNN to classify screenshots of
    four terrain types from a supplied dataset. Train for a fixed number of epochs,
    plot training and validation loss, and experiment with one architectural change
    (e.g., adding a layer or changing kernel size).
  deliverable: >
    Training script, loss/accuracy plots, a confusion matrix on the test set, and a
    written paragraph explaining the effect of the architectural change.

ml_bridge: >
  The architectures introduced here are the building blocks for Units 06 and 07:
  CNNs feed visual state to RL agents; RNNs and transformers underpin sequence-aware
  NPCs and LLM-driven dialogue systems.
