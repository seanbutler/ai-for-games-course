# Per-unit spec. LOCAL dependency: changing this rebuilds only this unit.

title: "AI for Game Content and Systems"
week: 4
time_budget_minutes:
  lecture: 120
  tutorial: 120

prerequisites:
  - "Unit 05 (neural network architectures)"
  - "Unit 04 (ML fundamentals: generative vs discriminative models)"

outcomes:
  - "Describe the main families of procedural content generation and their trade-offs. [lo6]"
  - "Explain how generative neural networks (GANs, VAEs, diffusion) produce game assets. [lo4, lo6]"
  - "Critically evaluate the role of ML-based physics approximation in interactive systems. [lo4, lo6]"
  - "Assess the practical pipeline for integrating generative AI into a game production workflow. [lo2, lo6]"

concepts:
  - "Procedural content generation taxonomy: constructive, search-based, ML-based"
  - "Rule-based and grammar-based PCG: L-systems, wave function collapse"
  - "Generative adversarial networks (GANs): generator/discriminator training loop; mode collapse"
  - "Variational autoencoders (VAEs): latent space, reconstruction vs KL loss; controllable generation"
  - "Diffusion models: denoising process, conditioning; text-to-image in asset pipelines"
  - "Neural physics approximation: replacing expensive simulation with learned surrogates"
  - "AI-generated textures, 3D models, level layouts, and dialogue"
  - "Quality, diversity, and controllability: the PCG evaluation triangle"
  - "Production considerations: artist-in-the-loop workflows, IP and copyright, bias in training data"

references: ["shaker-pcg", "liu2021", "goodfellow"]

worked_examples:
  - "Walk through wave function collapse generating a dungeon tile map: constraint propagation step by step."
  - "Explain GAN training dynamics using a 1D example (generator matching a Gaussian): show what mode collapse looks like."

tutorial:
  brief: >
    Using a supplied pre-trained GAN (or VAE) for 2D tile generation, write a Python
    script to sample N levels, visualise them, and implement a simple diversity metric
    (e.g., pairwise Hamming distance between tile grids). Compare the variety
    produced against a baseline noise-based generator supplied with the starter.
  deliverable: >
    Sampling script, visualisation of 10 generated levels, diversity metric results,
    and a written evaluation (approx. 300 words) of the generative model's strengths
    and failure modes for this use case.

ml_bridge: >
  PCG bridges classical techniques (unit 03 randomness, unit 02 spatial reasoning)
  with modern deep generative models. Students now have the vocabulary to evaluate
  where each sits in a real production pipeline.
