
title: "AI at Scale: Crowds, Economies, and Level of Detail"
week: 5
time_budget_minutes:
  lecture: 60
  tutorial: 60

prerequisites:
  - "Units 02–03 (pathfinding, decision making)"

outcomes:
  - "Apply level-of-detail strategies to AI update scheduling to maintain performance under large agent counts. [lo1, lo3]"
  - "Describe crowd and flow-field techniques and explain when they outperform per-agent pathfinding. [lo1, lo2]"
  - "Design a hierarchical AI architecture that coordinates individual agents, squads, and faction-level reasoning. [lo2, lo3]"
  - "Evaluate agent-based economic simulation techniques used in games and assess their trade-offs for scale and authorial control. [lo2, lo6]"

concepts:
  - "AI level of detail (LOD): full simulation, abstract simulation, and dormant states; distance-based and importance-based LOD; time-slicing update budgets"
  - "Crowd simulation: Reynolds boids (separation, alignment, cohesion); flow fields for large crowds; continuum crowd models; hybrid per-agent and flow-field approaches"
  - "Group and squad AI: formation movement, coordinated flanking, group decision-making; separating group intent from individual execution"
  - "Hierarchical AI: stacking individual agent AI, squad AI, commander AI, and faction strategy; each level operating at a different time granularity"
  - "Influence maps: encoding faction presence, threat, and resource value across the map; tactical querying at group and faction level"
  - "Agent-based economic simulation: supply/demand emergence from agent behaviour; role assignment and resource routing; self-organising economies (Dwarf Fortress, RimWorld, Mount & Blade)"
  - "Spatial partitioning for AI queries: grids, quadtrees, and k-d trees for efficient neighbour lookups and perception queries at scale"
  - "Performance budgeting: fixed per-frame AI time budgets, priority queues, amortisation across frames"

references: ["millington", "buckland", "aima"]

worked_examples:
  - "Design an LOD scheme for a city with 10 000 citizens: specify what each LOD tier simulates, the transition triggers, and how visible NPCs are re-hydrated from abstract state when the player approaches."
  - "Compare per-agent A* pathfinding vs a flow field for routing 500 units in a real-time strategy game: implementation cost, runtime cost, and quality of resulting paths."

tutorial:
  brief: >
    Scaling exercise. Students are given a single working agent (from the Unit 02 tutorial)
    and tasked with extending it to handle 1 000 instances by adding an LOD scheduler
    and replacing individual pathfinding calls with a shared flow field. They profile
    before and after and record the frame-time improvement.
  deliverable: >
    Modified source code with the LOD scheduler and flow field in place, plus a brief
    written profiling note (approx. 150 words) comparing frame time and behaviour
    fidelity at 100, 500, and 1 000 agents.

ml_bridge: >
  Establishes the performance budgeting mindset that applies equally to classical and
  ML-based agents. The LOD and abstraction concepts reappear when deploying neural
  agents at scale in Units 05–06.
