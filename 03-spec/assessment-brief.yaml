# Student-facing assessment brief. Derived from course.yaml assessment block.
# Generate the brief document from this file; keep course.yaml for architecture metadata only.

title: "Game AI Implementation Project"
module: "WM9SL-15 — AI and Games"
weight: 100
word_limit: 4000        # report only; code is not word-counted
submission_format: "Code archive + PDF report via Tabula"

introduced_in_unit: "01-introduction"   # brief walkthrough scheduled here
due: "End of Week 4 (exact date confirmed on Tabula)"

# -----------------------------------------------------------------------
# What students must submit
# -----------------------------------------------------------------------
deliverables:
  code:
    language: "C++"
    platform: "Must run without modification on the module reference platform"
    description: >
      A working, interactive game AI system. The codebase must be buildable
      from source with the provided configuration. Include a README
      describing build steps if you deviate from the default setup.
  report:
    length: "4000 words (±10 %; references and figure captions excluded)"
    format: "PDF"
    sections:
      - id: intro
        heading: "Introduction"
        guidance: >
          State the game context you chose and why. Identify the AI problems
          your project addresses and give a one-paragraph roadmap of the report.
      - id: classical
        heading: "Classical AI Components"
        guidance: >
          Explain the design and implementation of your foundation techniques
          (sensing, pathfinding, decision system, behaviour modelling). Justify your
          algorithmic choices with reference to module theory and relevant
          literature. Include complexity, speed and size analysis where it informs your choice.
      - id: ml
        heading: "Machine Learning Component"
        guidance: >
          Describe the ML technique you implemented, how it was trained, and
          how it integrates with the rest of the system. Compare its behaviour
          and trade-offs against the classical equivalent on the same in-game
          problem where applicable.
      - id: generative
        heading: "Generative / Modern AI Component"
        guidance: >
          Describe the generative technique you implemented (PCG, neural
          generative model, or LLM integration). Critically assess its impact
          on gameplay or content quality and discuss limitations.
      - id: scale_and_pipeline
        heading: "AI at Scale and Architecture / Pipeline"
        guidance: >
          Describe the architectural or pipeline work you undertook to make your AI
          system viable at scale or maintainable in production. This may cover one or
          more of: large-scale agent management (spatial indexing, LOD AI, crowds);
          a per-frame AI budget or time-sliced update scheduler; a data-driven
          authoring pipeline with external config or hot-reload; NavMesh generation
          and dynamic maintenance; or async / job-based offloading of expensive
          queries. Explain the design decisions you made, the performance impact you
          measured or estimated, and how this work integrates with the rest of the
          system. Where relevant, reference the constraints of real-time interactive
          software and compare your approach against simpler alternatives you
          considered.

      - id: evaluation
        heading: "Evaluation and Reflection"
        guidance: >
          Reflect on the overall system: what works, what doesn't, and why.
          Discuss limitations honestly and suggest concrete improvements.
          Compare your choices against alternatives you considered but did
          not implement.
      - id: conclusion
        heading: "Conclusion"
        guidance: >
          Summarise the contributions of the project. One paragraph is usually
          enough; do not introduce new material here.

# -----------------------------------------------------------------------
# Requirements — what must be implemented
# -----------------------------------------------------------------------

requirements:
  foundation:
    label: "Mandatory — all required"
    source_units: ["01-introduction", "02-pathfinding", "03-collision-and-perception", "04-decision-making"]
    techniques:
      - "Inputs : Sensing, Ranges, Volumetric Collisions, Rays, Visual Cones"
      - "Outputs : Movement, Actions"
      - "Pathfinding algorithm (A* recommended; alternatives must be justified)"
      - "Decision system (FSM or behaviour tree)"
      - "At least one behaviour-modelling technique (steering, GOAP, utility AI, etc.)"

  advanced_learning:
    label: "Choose at least one"
    source_units: ["05-ml-foundations", "06-neural-networks", "07-ai-agents-learning"]
    techniques:
      - "Trained neural network applied to a meaningful in-game problem"
      - "Reinforcement-learning agent"
      - "Imitation-learning component"

  advanced_generative:
    label: "Choose at least one"
    source_units: ["08-ai-content-systems", "09-modern-ai-applications"]
    techniques:
      - "Procedural content generation (grammar-based, search-based, or noise-based)"
      - "Neural generative model (VAE, GAN, diffusion) applied to game content"
      - "LLM-driven component integrated into gameplay"

  advanced_scale:
    label: "Choose at least one"
    source_units: ["10-ai-at-scale", "11-ai-tooling-pipeline"]
    techniques:
      - "Large-scale agent management: spatial indexing, LOD AI, or crowd simulation handling hundreds of agents at interactive frame rates"
      - "AI performance budgeting system: time-sliced or prioritised update scheduling that keeps AI cost within a fixed per-frame budget"
      - "Data-driven AI pipeline: external behaviour authoring (e.g. behaviour tree editor, data tables) with hot-reload or build-time validation"
      - "NavMesh generation and maintenance pipeline, including dynamic obstacle handling or incremental re-bake"
      - "Async / job-based AI computation: offloading sensing, pathfinding, or decision queries to worker threads with correct synchronisation"

# -----------------------------------------------------------------------
# Marking scheme
# -----------------------------------------------------------------------
marking_scheme:
  - criterion: "Implementation quality"
    weight_pct: 35
    descriptors:
      high: "All required techniques implemented correctly; code is clean, modular, and runs reliably."
      mid: "Foundation techniques present and functional; advanced components partially working."
      low: "Missing required techniques or code does not run."

  - criterion: "Technical understanding (report)"
    weight_pct: 30
    descriptors:
      high: "Report demonstrates deep understanding of every component; design decisions are well-reasoned and grounded in theory."
      mid: "Adequate explanation of most components; some reasoning is superficial or unsupported."
      low: "Report is largely descriptive; little evidence of understanding why choices were made."

  - criterion: "Critical comparison"
    weight_pct: 20
    descriptors:
      high: "Classical and ML/generative approaches compared rigorously on the same problem; trade-offs quantified or otherwise evidenced."
      mid: "Some comparison present but limited to qualitative observations."
      low: "No meaningful comparison between approaches."

  - criterion: "Reflection and evaluation"
    weight_pct: 15
    descriptors:
      high: "Honest, specific reflection on limitations; concrete and technically credible improvements proposed."
      mid: "Reflection present but vague; improvements are generic."
      low: "Little or no reflection; limitations not acknowledged."

# -----------------------------------------------------------------------
# Outcome mapping (for moderation record — not published to students)
# -----------------------------------------------------------------------
maps_to_outcomes:
  lo1: "Report — classical AI section; code demonstrating pathfinding, decision systems, and behaviour modelling."
  lo2: "Report — critical comparison section; justified technique selection for the game context."
  lo3: "Working C++ implementation of classical algorithms in an interactive environment."
  lo4: "Report — ML section explaining the technique; code demonstrating correct application."
  lo5: "Working neural network or RL component applied to an in-game problem."
  lo6: "Report — generative/modern AI section; critical assessment of real-world impact and trade-offs. Report — scale and pipeline section; evidence of architectural thinking and performance-aware design."
