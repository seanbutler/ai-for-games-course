# Course-level spec. GLOBAL dependency: changing this triggers a rebuild of every unit.

title: "AI and Games"
code: "WM9SL-15"
level: "MSc Games Engineering"
institution: "University of Warwick"
department: "WMG"
credits: 15
contact_hours: 30          # 15 lectures + 15 tutorials
duration_weeks: 4
cadence: "Intensive (4 weeks) 2 x 4-hour lectorials per week"

philosophy: >
  Classical-first. Students build a working intuition for traditional, hand-authored
  game AI (search, world perception, decision making, behaviour modelling) before layering on modern
  machine-learning approaches. Every technique is grounded in something buildable,
  and classical and ML methods are compared on the same problem wherever possible.

audience: >
  MSc students on the Games Engineering programme. Strong programming ability
  (C++ using an in house base c++ shell for windows graphics and IO), data-structures fundamentals, and
  some real-time/games exposure assumed. No prior AI or ML coursework assumed.

# Module-level learning outcomes — taken directly from WM9SL-15 specification.
outcomes:
  lo1: >
    Critically analyse the principles and techniques used in traditional game artificial
    intelligence, including pathfinding, decision systems, and behaviour modelling.
  lo2: >
    Evaluate and compare different AI approaches used in games, including rule-based
    systems and machine learning methods, and justify their suitability for specific
    design or technical problems.
  lo3: >
    Design and implement classical game AI algorithms within an interactive environment,
    such as pathfinding or behaviour systems for game agents.
  lo4: >
    Demonstrate a conceptual understanding of modern machine learning techniques,
    including neural networks, convolutional networks, recurrent networks, and
    transformer architectures.
  lo5: >
    Develop and apply neural network-based solutions to solve practical problems
    relevant to games or interactive systems.
  lo6: >
    Critically assess the role and impact of modern AI technologies in game development,
    such as agent behaviour, content generation, rendering enhancement, and large
    language model integration.

# Unit categories referenced by the assessment requirements below.
unit_categories:
  foundation:
    description: >
      Classical AI techniques that every submission must implement.
    units: ["01-introduction", "02-pathfinding", "03-collision-and-perception", "04-decision-making"]
  advanced_learning:
    description: >
      Machine-learning techniques; students must implement at least one.
    units: ["05-ml-foundations", "06-neural-networks", "07-ai-agents-learning"]
  advanced_generative:
    description: >
      Generative and modern AI techniques; students must implement at least one.
    units: ["08-ai-content-systems", "09-modern-ai-applications"]
  applied_context:
    description: >
      Applied units covering large-scale agent architectures and the authoring/debugging
      toolchain for classical game AI. Students are expected to draw on these when
      justifying performance and design decisions in their project report.
    units: ["10-ai-at-scale", "11-ai-tooling-pipeline"]

assessment:
  - id: project
    title: "Game AI Implementation Project"
    type: "Individual project — C++ implementation with written report"
    weight: 100
    deliverables:
      code:
        language: "C++"
        description: >
          A working, interactive game AI system demonstrating all required techniques.
          Must run without modification on the module's reference platform.
        requirements:
          mandatory: >
            All foundation techniques from Units 01–03: pathfinding (e.g. A*),
            a decision system (e.g. FSM or behaviour tree), and at least one
            behaviour-modelling technique.
          advanced_learning: >
            At least one technique from Units 04–06: a trained neural network,
            reinforcement-learning agent, or imitation-learning component applied
            to a meaningful in-game problem.
          advanced_generative: >
            At least one technique from Units 07–08: procedural content generation,
            a neural generative model, or an LLM-driven component integrated into
            gameplay.
      report:
        length: "4000 words"
        description: >
          A technical report documenting the submitted implementation. It must:
          (a) explain the design and architecture of each AI component;
          (b) justify technique choices with reference to module theory and literature;
          (c) critically compare the classical and ML/generative components on the
              same in-game problem where applicable;
          (d) reflect on limitations and potential improvements.
          The report is the primary evidence markers use to assess LOs; code alone
          is not sufficient — the report must make the reasoning visible.
    maps_to_units:
      - "01-introduction"
      - "02-pathfinding"
      - "03-collision-and-perception"
      - "04-decision-making"
      - "05-ml-foundations"
      - "06-neural-networks"
      - "07-ai-agents-learning"
      - "08-ai-content-systems"
      - "09-modern-ai-applications"
      - "10-ai-at-scale"
      - "11-ai-tooling-pipeline"
    maps_to_outcomes: [lo1, lo2, lo3, lo4, lo5, lo6]
    outcome_evidence:
      lo1: "Report section analysing the classical AI components; code demonstrating pathfinding, decision systems, and behaviour modelling."
      lo2: "Report section comparing classical vs ML/generative choices; justified selection of techniques for the specific game context."
      lo3: "Working C++ implementation of classical algorithms in an interactive environment."
      lo4: "Report section explaining the ML technique(s) used; code demonstrating correct application."
      lo5: "Working neural network or RL component applied to an in-game problem."
      lo6: "Report critical assessment of the generative/modern AI component; discussion of real-world impact and trade-offs."

benchmarks:
  - "Georgia Tech CS 7632 (Game AI)"
  - "Falmouth MSc game AI provision"
